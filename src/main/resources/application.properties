spring.application.name=truthlens-backend

# Server Configuration
server.port=8080

# Default Database Settings (H2 In-Memory with PostgreSQL compatibility mode)
spring.datasource.url=jdbc:h2:mem:truthlens_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# SQL Script Init (Disabled - DataInitializer.java handles initialization cleanly via JPA)
spring.sql.init.mode=never

# JPA / Hibernate Configurations
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console (Available at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Static Web Resources
spring.web.resources.static-locations=classpath:/static/

# SpringDoc OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

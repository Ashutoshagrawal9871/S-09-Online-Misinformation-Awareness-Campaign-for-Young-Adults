spring.application.name=truthlens-backend

# Server Configuration
server.port=${PORT:8080}

# Database Configuration
# Local development defaults to H2, but production/cloud deployments can override with env vars.
# Example PostgreSQL URL: jdbc:postgresql://host:5432/truthlens_db
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:h2:mem:truthlens_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:${DB_DRIVER_CLASS_NAME:org.h2.Driver}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:sa}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}

# SQL Script Init (Disabled - DataInitializer.java handles initialization cleanly via JPA)
spring.sql.init.mode=never

# JPA / Hibernate Configurations
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:${DB_DIALECT:org.hibernate.dialect.H2Dialect}}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (safe to disable in production)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Static Web Resources
spring.web.resources.static-locations=classpath:/static/

# SpringDoc OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# Override JWT_SECRET with a unique base64-encoded key in cloud deployments.

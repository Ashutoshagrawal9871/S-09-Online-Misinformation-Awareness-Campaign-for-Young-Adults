<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">SIFT Pocket Cheat Sheet</title>
  <desc id="desc">Four-step SIFT verification framework poster: Stop, Investigate the source, Find better coverage, Trace claims.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <circle cx="1080" cy="80" r="220" fill="#4f46e5" opacity="0.18"/>
  <circle cx="120" cy="820" r="260" fill="#06b6d4" opacity="0.10"/>

  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="72" y="88" fill="#38bdf8" font-size="22" font-weight="700" letter-spacing="5">TRUTHLENS · S-09</text>
    <text x="72" y="160" fill="#f8fafc" font-size="72" font-weight="800">SIFT Pocket Cheat Sheet</text>
    <text x="72" y="204" fill="#a5b4fc" font-size="26">Verify before you amplify — four habits that stop viral misinformation.</text>

    <g transform="translate(72,260)">
      <rect width="1056" height="112" rx="20" fill="#111c33" stroke="#334155"/>
      <circle cx="58" cy="56" r="32" fill="#6366f1"/>
      <text x="58" y="70" fill="#ffffff" font-size="30" font-weight="800" text-anchor="middle">S</text>
      <text x="112" y="48" fill="#ffffff" font-size="26" font-weight="700">STOP</text>
      <text x="112" y="80" fill="#cbd5e1" font-size="20">Notice the emotional pull. Pause before you like, comment, or forward.</text>
    </g>

    <g transform="translate(72,392)">
      <rect width="1056" height="112" rx="20" fill="#111c33" stroke="#334155"/>
      <circle cx="58" cy="56" r="32" fill="#0ea5e9"/>
      <text x="58" y="70" fill="#ffffff" font-size="30" font-weight="800" text-anchor="middle">I</text>
      <text x="112" y="48" fill="#ffffff" font-size="26" font-weight="700">INVESTIGATE THE SOURCE</text>
      <text x="112" y="80" fill="#cbd5e1" font-size="20">Who published it? Check the domain, author, date, and original post.</text>
    </g>

    <g transform="translate(72,524)">
      <rect width="1056" height="112" rx="20" fill="#111c33" stroke="#334155"/>
      <circle cx="58" cy="56" r="32" fill="#06b6d4"/>
      <text x="58" y="70" fill="#ffffff" font-size="30" font-weight="800" text-anchor="middle">F</text>
      <text x="112" y="48" fill="#ffffff" font-size="26" font-weight="700">FIND BETTER COVERAGE</text>
      <text x="112" y="80" fill="#cbd5e1" font-size="20">Search the claim. Look for IFCN-certified fact-checkers and primary sources.</text>
    </g>

    <g transform="translate(72,656)">
      <rect width="1056" height="112" rx="20" fill="#111c33" stroke="#334155"/>
      <circle cx="58" cy="56" r="32" fill="#22d3ee"/>
      <text x="58" y="70" fill="#0f172a" font-size="30" font-weight="800" text-anchor="middle">T</text>
      <text x="112" y="48" fill="#ffffff" font-size="26" font-weight="700">TRACE CLAIMS</text>
      <text x="112" y="80" fill="#cbd5e1" font-size="20">Reverse image search. Find the original context, then compare.</text>
    </g>

    <rect x="72" y="796" width="1056" height="3" fill="url(#accent)"/>
    <text x="72" y="850" fill="#94a3b8" font-size="20">Tools: Google Lens · TinEye · InVID-WeVerify · Google Fact Check Explorer · PIB Fact Check</text>
    <text x="1128" y="850" fill="#38bdf8" font-size="20" text-anchor="end" font-weight="700">truthlens · cusoc 2026</text>
  </g>
</svg>
